# Career-Ops Profile -- Dual-Track Example (Engineer + Instructor)
#
# Fictional persona. Demonstrates how to configure a profile when you are
# optimizing for TWO archetypes at the same time -- e.g. Senior AI Engineer
# AND Senior Technical Instructor. See README.md in this folder for the
# rationale and the interview-objection playbook.
#
# Copy this file to config/profile.yml and edit before using.

candidate:
  full_name: "Sumanth Pabba"
  email: "pabbasumanth8@gmail.com"
  phone: "+1 4373299563"          # placeholder, replace with your real number
  location: "Kanata, Canada"
  linkedin: "https://www.linkedin.com/in/sumanth-pabba-690778168/"
  portfolio_url: "https://sumanthpabba.pro/"
  github: "https://github.com/Sumanth-Uwin"
  twitter: null

target_roles:
  primary:
    - "Full Stack Developer"
    - "Frontend Developer"
    - "Backend Developer"
    - "Software Engineer"

  archetypes:
    - name: "Frontend Engineer"
      level: "Entry > 3+ > 4+"
      fit: "primary"
      sell_when: "JD emphasizes React, Next.js, TypeScript, UI implementation, responsive design, component systems, accessibility, frontend performance, or close product/design collaboration"

    - name: "Backend Engineer"
      level: "Entry > 3+ > 4+ > 5+"
      fit: "primary"
      sell_when: "JD emphasizes APIs, databases, authentication, distributed systems, backend services, integrations, scalability, reliability, or server-side application logic"

    - name: "Full Stack Engineer"
      level: "Entry > 3+ > 4+"
      fit: "primary"
      sell_when: "JD wants someone who can build end-to-end features across frontend and backend, own product slices, move fast in startups, and work across UI, API, and database layers"

    - name: "Software Engineer"
      level: "Entry > 3+"
      fit: "secondary"
      sell_when: "JD is broad and generalist, uses generic software engineer wording, and does not lean strongly frontend-only or backend-only"

    - name: "Platform / API Engineer"
      level: "3+ > 4+ > 5+"
      fit: "adjacent"
      sell_when: "JD emphasizes internal tools, developer platforms, API design, CI/CD, infrastructure, performance, service ownership, or engineering productivity"

    - name: "Application Engineer"
      level: "Entry > 3+"
      fit: "adjacent"
      sell_when: "JD emphasizes shipping business features quickly, working closely with stakeholders, maintaining product applications, and balancing pragmatism over deep specialization"

